name: mtn-subscription

services:
  # Base de données PostgreSQL : tables créées par le backend (prisma db push)
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copier .env.example vers .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copier .env.example vers .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copier .env.example vers .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backnet]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # API Express + Prisma (dossier server/)
  backend:
    image: ${REGISTRY:-local}/mtn-backend:${IMAGE_TAG:-dev}
    build:
      context: ./server
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Africa/Douala
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Définir ADMIN_EMAIL dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD dans .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [backnet, frontnet]
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

  # Site React servi par Nginx, avec relais /api vers le backend (dossier client/)
  frontend:
    image: ${REGISTRY:-local}/mtn-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [frontnet]
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

volumes:
  pgdata:

networks:
  backnet:
  frontnet:
