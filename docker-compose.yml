name: mtn-subscription

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copier .env.example vers .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copier .env.example vers .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copier .env.example vers .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backnet]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  backend:
    image: ${REGISTRY:-local}/mtn-backend:${IMAGE_TAG:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [backnet, frontnet]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  frontend:
    image: ${REGISTRY:-local}/mtn-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [frontnet]
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

volumes:
  pgdata:

networks:
  backnet:
  frontnet:
