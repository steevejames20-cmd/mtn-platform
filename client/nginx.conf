server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : réduit la quantité de données transférées
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Fichiers Vite à nom haché : mis en cache par le navigateur
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application React : toute autre URL renvoie index.html (routes React Router)
    location / {
        try_files $uri /index.html;
    }

    # API relayée vers le service backend (nom du service Compose)
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sonde de santé du backend
    location = /health {
        proxy_pass http://backend:4000;
    }
}
